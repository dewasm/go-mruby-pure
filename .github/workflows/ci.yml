name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The committed generated interpreter is what users build; this job is their exact path.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go test -race ./...

  # Prove the committed artifacts still come from the pinned sources: rebuild the wasm
  # (byte-identical by construction) and reconvert with the pinned dewasm revision,
  # requiring an empty diff against the checked-in generated files.
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the pinned dewasm revision
        id: dewasm
        run: echo "revision=$(cat DEWASM_REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: dewasm-cache
        with:
          path: ~/.dewasm
          key: dewasm-${{ runner.os }}-${{ steps.dewasm.outputs.revision }}
      - name: Build dewasm at the pinned revision
        if: steps.dewasm-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/dewasm/dewasm \
            --rev "${{ steps.dewasm.outputs.revision }}" --locked \
            --root ~/.dewasm dewasm
      - name: Export DEWASM_BIN
        run: echo "DEWASM_BIN=$HOME/.dewasm/bin/dewasm" >> "$GITHUB_ENV"
      - run: make
      - run: git diff --exit-code -- mrubyvm/
